<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#006c4c" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TeamFund</title>
    
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Roboto', 'sans-serif'],
            },
            colors: {
              // Material 3 Color Tokens (Emerald Seed)
              'md-sys-color-primary': '#006c4c',
              'md-sys-color-on-primary': '#ffffff',
              'md-sys-color-primary-container': '#89f8c6',
              'md-sys-color-on-primary-container': '#002114',
              
              'md-sys-color-secondary': '#4d6357',
              'md-sys-color-on-secondary': '#ffffff',
              'md-sys-color-secondary-container': '#d0e8d9',
              'md-sys-color-on-secondary-container': '#0b1f16',
              
              'md-sys-color-tertiary': '#3d6373',
              'md-sys-color-on-tertiary': '#ffffff',
              'md-sys-color-tertiary-container': '#c1e8fb',
              'md-sys-color-on-tertiary-container': '#001f29',
              
              'md-sys-color-error': '#ba1a1a',
              'md-sys-color-on-error': '#ffffff',
              'md-sys-color-error-container': '#ffdad6',
              'md-sys-color-on-error-container': '#410002',
              
              'md-sys-color-background': '#fbfdf9',
              'md-sys-color-on-background': '#191c1a',
              
              'md-sys-color-surface': '#fbfdf9',
              'md-sys-color-on-surface': '#191c1a',
              'md-sys-color-surface-variant': '#dbe5dd',
              'md-sys-color-on-surface-variant': '#404943',
              'md-sys-color-outline': '#707973',
              
              'md-sys-color-surface-container-low': '#f5fbf7',
              'md-sys-color-surface-container': '#eff5f1',
              'md-sys-color-surface-container-high': '#e9efeb',
            },
            boxShadow: {
              'md-elevation-1': '0px 1px 3px 1px rgba(0, 0, 0, 0.15), 0px 1px 2px 0px rgba(0, 0, 0, 0.30)',
              'md-elevation-2': '0px 2px 6px 2px rgba(0, 0, 0, 0.15), 0px 1px 2px 0px rgba(0, 0, 0, 0.30)',
              'md-elevation-3': '0px 4px 8px 3px rgba(0, 0, 0, 0.15), 0px 1px 3px 0px rgba(0, 0, 0, 0.30)',
            },
            borderRadius: {
              'md-sm': '8px',
              'md-md': '12px',
              'md-lg': '16px',
              'md-xl': '28px', // Standard Card radius
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #fbfdf9; /* surface */
        color: #191c1a; /* on-surface */
      }
      /* Hide scrollbar for clean look */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #dbe5dd; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #707973; 
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
